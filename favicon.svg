<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120">
  <defs>
    <symbol id="chef" viewBox="0 0 106 122">
        <ellipse cx="52" cy="112" rx="38" ry="6" fill="#000000" opacity="0.05"/>

        <!-- apron body -->
        <path d="M15,122 C15,96 30,86 52,86 C74,86 89,96 89,122 Z" fill="#294B34" stroke="#1F3A27" stroke-width="0.6"/>
        <path d="M35,86 L31,72" stroke="#294B34" stroke-width="3.5" stroke-linecap="round" fill="none"/>
        <path d="M69,86 L73,72" stroke="#294B34" stroke-width="3.5" stroke-linecap="round" fill="none"/>
        <rect x="43" y="101" width="18" height="13" rx="2.5" fill="#1F3A27" opacity="0.5"/>

        <!-- collar peek -->
        <path d="M41,86 L63,86 L58,96 L46,96 Z" fill="#FAF6EC"/>

        <!-- neck -->
        <rect x="45" y="72" width="12" height="16" fill="#C99361"/>

        <!-- ears -->
        <circle cx="24" cy="64" r="6.5" fill="#D9A968" stroke="#6B4A24" stroke-width="0.8"/>
        <circle cx="80" cy="64" r="6.5" fill="#D9A968" stroke="#6B4A24" stroke-width="0.8"/>

        <!-- head (slightly elongated, adult proportions) -->
        <ellipse cx="52" cy="60" rx="27" ry="30" fill="#D9A968" stroke="#6B4A24" stroke-width="0.9"/>

        <!-- chef hat -->
        <rect x="26" y="36" width="52" height="12" rx="5" fill="#FAF6EC" stroke="#6B4A24" stroke-width="0.9"/>
        <g fill="#FAF6EC" stroke="#6B4A24" stroke-width="0.7">
          <circle cx="34" cy="25" r="9"/>
          <circle cx="47" cy="18" r="10.5"/>
          <circle cx="59" cy="18" r="10.5"/>
          <circle cx="71" cy="25" r="9"/>
        </g>
        <rect x="28" y="29" width="48" height="10" fill="#FAF6EC"/>

        <!-- eyebrows: thin, angled - a serious, dignified look -->
        <path d="M34,52 Q40,48 47,51" stroke="#9A9A94" stroke-width="1.2" fill="none" stroke-linecap="round"/>
        <path d="M57,51 Q64,48 70,52" stroke="#9A9A94" stroke-width="1.2" fill="none" stroke-linecap="round"/>

        <!-- eyes -->
        <circle cx="42" cy="58" r="1.5" fill="#2E2A20"/>
        <circle cx="62" cy="58" r="1.5" fill="#2E2A20"/>
        <path d="M38,55 Q42,53.5 46,55" stroke="#6B4A24" stroke-width="0.6" fill="none" opacity="0.7"/>
        <path d="M58,55 Q62,53.5 66,55" stroke="#6B4A24" stroke-width="0.6" fill="none" opacity="0.7"/>
        <path d="M37,63 Q42,65 47,63" stroke="#B78A55" stroke-width="0.7" fill="none" opacity="0.6"/>
        <path d="M57,63 Q62,65 67,63" stroke="#B78A55" stroke-width="0.7" fill="none" opacity="0.6"/>

        <!-- nose -->
        <path d="M52,57 C50,63 48,68 48,70 C48,72.5 56,72.5 56,70 C56,68 54,63 52,57 Z" fill="#C99361" stroke="#6B4A24" stroke-width="0.5"/>
        <path d="M45,68 Q42,72 44,76" stroke="#B78A55" stroke-width="0.5" fill="none" opacity="0.4"/>
        <path d="M59,68 Q62,72 60,76" stroke="#B78A55" stroke-width="0.5" fill="none" opacity="0.4"/>

        <!-- mustache: small, trimmed -->
        <path d="M40,73 C44,70.5 48,72.5 52,72 C56,72.5 60,70.5 64,73 C62,78 57,77 52,75 C47,77 42,78 40,73 Z" fill="#F4F1EA" stroke="#6B4A24" stroke-width="0.7"/>

        <!-- mouth -->
        <path d="M47,80 Q52,82 57,80" stroke="#6B4A24" stroke-width="1" fill="none" stroke-linecap="round"/>

        <!-- forehead line -->
        <path d="M40,44 Q52,41 64,44" stroke="#B78A55" stroke-width="0.6" fill="none" opacity="0.5"/>

        <!-- arm + hand stirring with a wooden spoon -->
        <path d="M82,105 C95,100 99,88 94,78 C90,86 83,94 76,101 Z" fill="#FAF6EC" stroke="#6B4A24" stroke-width="0.8"/>
        <circle cx="94" cy="79" r="6.5" fill="#D9A968" stroke="#6B4A24" stroke-width="0.7"/>
        <g transform="rotate(-24 94 79)">
          <rect x="91" y="52" width="4.5" height="28" rx="2.2" fill="#8A6530"/>
          <ellipse cx="93.2" cy="50" rx="6.5" ry="4.5" fill="#8A6530"/>
        </g>
    </symbol>
  </defs>
  <circle cx="60" cy="60" r="58" fill="#F8F1DF"/>
  <circle cx="60" cy="60" r="56" fill="none" stroke="#3B6141" stroke-width="1.5"/>
  <circle cx="60" cy="60" r="47" fill="none" stroke="#A85F32" stroke-width="0.9"/>
  <path id="curveTop" d="M27.16,51.2 A34,34 0 0 1 92.84,51.2" fill="none"/>
  <text font-family="Baloo 2, serif" font-size="9" font-weight="700" fill="#294B34" letter-spacing="1">
    <textPath href="#curveTop" startOffset="50%" text-anchor="middle">LO DE GASTÓN</textPath>
  </text>
  <use href="#chef" width="106" height="122" transform="translate(30.18,26.2) scale(0.52)"/>
</svg>
