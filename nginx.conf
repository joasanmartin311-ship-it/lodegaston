server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_comp_level 6;
    gzip_min_length 512;
    gzip_vary on;
    gzip_types text/plain text/css text/xml application/xml application/javascript application/json image/svg+xml image/x-icon;

    location / {
        try_files $uri $uri/ =404;
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    location ~* \.(webp|jpg|jpeg|png|ico|svg)$ {
        add_header Cache-Control "public, max-age=2592000";
    }

    location ~* \.(xml|txt)$ {
        add_header Cache-Control "public, max-age=3600";
    }
}
